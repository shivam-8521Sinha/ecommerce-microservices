server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/products/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/orders/**

            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/inventory/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payments/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoint:
    gateway:
      access: read-only

  endpoints:
    web:
      exposure:
        include: health,info,gateway